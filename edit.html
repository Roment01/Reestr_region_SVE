<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Редактор реестра АТД</title>
  <style>
    :root{--navy:#1f4e78;--dark:#153754;--border:#cbd5e1;--bg:#f1f5f9;--muted:#64748b}
    *{box-sizing:border-box}body{margin:0;padding:20px;background:linear-gradient(180deg,#f8fafc,var(--bg));color:#1e293b;font-family:Arial,sans-serif}
    .card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 4px 12px #0f172a12;border-left:6px solid var(--navy)}h1{margin:0 0 8px;color:var(--navy);font-size:clamp(20px,5vw,30px)}p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.btn{border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}.primary{background:var(--navy);color:#fff}.primary:hover{background:var(--dark)}.secondary{background:#fff;color:#334155;border:1px solid var(--border)}
    .search{flex:1 1 220px;min-width:180px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font:inherit}.table-wrap{overflow:auto;max-height:68vh;background:#fff;border:1px solid var(--border);border-radius:12px}table{width:100%;min-width:1450px;border-collapse:collapse;font-size:13px}th,td{border:1px solid var(--border);padding:8px 10px;vertical-align:top}th{background:var(--navy);color:#fff;position:sticky;top:0;z-index:1}td[contenteditable=true]:focus{outline:2px solid #3b82f6;background:#eff6ff}.num,.actions{text-align:center;background:#f8fafc}.actions button{border:1px solid var(--border);background:#fff;border-radius:5px;margin:1px;cursor:pointer;padding:4px 6px}.footer{color:var(--muted);font-size:12px;margin-top:12px}
  </style>
</head>
<body>
  <header class="card"><h1>Редактор реестра АТД Республики Светлославия</h1><p>Данные сохраняются в этом браузере. Кнопка «Опубликовать» делает текущие данные доступными на странице public на этом устройстве.</p></header>
  <div class="toolbar">
    <button class="btn primary" onclick="addRow()">＋ Добавить строку</button>
    <button class="btn primary" onclick="publish()">Опубликовать реестр</button>
    <a class="btn secondary" href="./public.html">Открыть public</a>
    <button class="btn secondary" onclick="downloadJson()">Скачать JSON</button>
    <button class="btn secondary" onclick="document.getElementById('file').click()">Загрузить JSON</button>
    <input id="file" type="file" accept="application/json" hidden onchange="loadJson(event)">
    <input id="search" class="search" placeholder="Поиск…" oninput="renderFilter()">
  </div>
  <div class="table-wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
  <div class="footer" id="status"></div>
<script>
const KEY='reestr_region_sve_registry';
const HEADERS=['№ п/п','Реестровый идентификатор','Наименование','Категория и уровень','Административный центр','Историко-географическая привязка','Пространственное описание','Правовые основания','Статус территории','Внутренняя структура','Примечания / Особые отметки'];
let rows=JSON.parse(localStorage.getItem(KEY)||'[]');
const body=document.getElementById('body');
function clean(v){return String(v??'').replace(/\r?\n/g,' ').trim()}
function save(){localStorage.setItem(KEY,JSON.stringify(rows));status(`Сохранено записей: ${rows.length}`)}
function render(){document.getElementById('head').innerHTML=HEADERS.map(h=>`<th>${h}</th>`).join('')+'<th>Действия</th>';body.innerHTML=rows.map((row,i)=>`<tr><td class="num">${i+1}</td>${HEADERS.slice(1).map((_,j)=>`<td contenteditable="true" data-row="${i}" data-col="${j}">${esc(row[j]||'')}</td>`).join('')}<td class="actions"><button onclick="duplicate(${i})">⧉</button><button onclick="removeRow(${i})">×</button></td></tr>`).join('');document.querySelectorAll('[contenteditable]').forEach(cell=>cell.addEventListener('input',e=>{rows[+e.target.dataset.row][+e.target.dataset.col]=clean(e.target.innerText);save()}));renderFilter()}
function renderFilter(){const q=clean(document.getElementById('search').value).toLowerCase();[...body.rows].forEach(tr=>tr.style.display=!q||tr.innerText.toLowerCase().includes(q)?'':'none')}
function addRow(){rows.push(Array(10).fill(''));save();render()}
function duplicate(i){rows.splice(i+1,0,[...rows[i]]);save();render()}
function removeRow(i){if(confirm('Удалить строку?')){rows.splice(i,1);save();render()}}
function publish(){save();status('Реестр опубликован. Откройте страницу public.');window.open('./public.html','_blank')}
function downloadJson(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(rows,null,2)],{type:'application/json'}));a.download='reestr-region-sve.json';a.click()}
function loadJson(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!Array.isArray(data))throw Error();rows=data.map(row=>Array.from({length:10},(_,i)=>clean(row[i])));save();render()}catch{alert('Некорректный JSON')}};r.readAsText(file);e.target.value=''}
function status(text){document.getElementById('status').textContent=text}
function esc(v){return clean(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if(!rows.length)rows=[Array(10).fill('')];render();status('Редактор готов');
</script>
</body>
</html>
