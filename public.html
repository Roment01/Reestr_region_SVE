<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Редактор реестра АТД</title>
  <style>
    :root{--navy:#1f4e78;--dark:#153754;--border:#cbd5e1;--bg:#f1f5f9;--muted:#64748b}
    *{box-sizing:border-box}body{margin:0;padding:20px;background:linear-gradient(180deg,#f8fafc,var(--bg));color:#1e293b;font-family:Arial,sans-serif}
    .card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 4px 12px #0f172a12;border-left:6px solid var(--navy)}h1{margin:0 0 8px;color:var(--navy);font-size:clamp(20px,5vw,30px)}p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.btn{border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--navy);color:#fff}.primary:hover{background:var(--dark)}.secondary{background:#fff;color:#334155;border:1px solid var(--border)}.success{background:#16a34a;color:#fff}.success:hover{background:#15803d}
    .search{flex:1 1 220px;min-width:180px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font:inherit}.table-wrap{overflow:auto;max-height:68vh;background:#fff;border:1px solid var(--border);border-radius:12px}table{width:100%;min-width:1450px;border-collapse:collapse;font-size:13px}th,td{border:1px solid var(--border);padding:8px 10px;vertical-align:top}th{background:var(--navy);color:#fff;position:sticky;top:0;z-index:1}td[contenteditable=true]:focus{outline:2px solid #3b82f6;background:#eff6ff}.num,.actions{text-align:center;background:#f8fafc}.actions button{border:1px solid var(--border);background:#fff;border-radius:5px;margin:1px;cursor:pointer;padding:4px 6px}.footer{color:var(--muted);font-size:12px;margin-top:12px}
  </style>
</head>
<body>
  <header class="card">
    <h1>Редактор реестра АТД Республики Светлославия</h1>
    <p>Данные сохраняются в браузере. Кнопка «Опубликовать в GitHub» откроет страницу GitHub с готовым JSON-файлом, который нужно сохранить коммитом.</p>
  </header>

  <div class="toolbar">
    <button class="btn primary" onclick="addRow()">＋ Добавить строку</button>
    <button class="btn success" onclick="publishToGithub()">📤 Опубликовать в GitHub</button>
    <a class="btn secondary" href="./public.html" target="_blank" rel="noopener">👁️ Открыть public</a>
    <button class="btn secondary" onclick="downloadJson()">⬇️ Скачать JSON</button>
    <button class="btn secondary" onclick="document.getElementById('file').click()">⬆️ Загрузить JSON</button>
    <input id="file" type="file" accept="application/json" hidden onchange="loadJson(event)">
    <input id="search" class="search" placeholder="Поиск…" oninput="renderFilter()">
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr id="head"></tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
  </div>

  <div class="footer" id="status"></div>

  <script>
    const KEY = 'reestr_region_sve_registry';
    const HEADERS = ['№ п/п','Реестровый идентификатор','Наименование','Категория и уровень','Административный центр','Историко-географическая привязка','Пространственное описание','Правовые основания','Статус территории','Внутренняя структура','Примечания / Особые отметки'];

    let rows = JSON.parse(localStorage.getItem(KEY) || '[]');
    const body = document.getElementById('body');

    function clean(value) {
      return String(value ?? '').replace(/\r?\n/g, ' ').trim();
    }

    function save() {
      localStorage.setItem(KEY, JSON.stringify(rows));
      status(`Сохранено записей: ${rows.length}`);
    }

    function render() {
      const head = document.getElementById('head');
      head.innerHTML = HEADERS.map(h => `<th>${h}</th>`).join('') + '<th>Действия</th>';

      body.innerHTML = rows.map((row, i) => {
        const cells = HEADERS.slice(1).map((_, j) => `<td contenteditable="true" data-row="${i}" data-col="${j}">${escapeHtml(row[j] || '')}</td>`).join('');
        return `<tr>
          <td class="num">${i + 1}</td>
          ${cells}
          <td class="actions">
            <button type="button" onclick="duplicate(${i})">⧉</button>
            <button type="button" onclick="removeRow(${i})">×</button>
          </td>
        </tr>`;
      }).join('');

      document.querySelectorAll('[contenteditable]').forEach(cell => {
        cell.addEventListener('input', e => {
          const row = Number(e.target.dataset.row);
          const col = Number(e.target.dataset.col);
          rows[row][col] = clean(e.target.innerText);
          save();
        });
      });

      renderFilter();
    }

    function renderFilter() {
      const q = clean(document.getElementById('search').value).toLowerCase();
      [...body.rows].forEach(tr => {
        tr.style.display = (!q || tr.innerText.toLowerCase().includes(q)) ? '' : 'none';
      });
    }

    function addRow() {
      rows.push(Array(10).fill(''));
      save();
      render();
    }

    function duplicate(i) {
      rows.splice(i + 1, 0, [...rows[i]]);
      save();
      render();
    }

    function removeRow(i) {
      if (!confirm('Удалить строку?')) return;
      rows.splice(i, 1);
      save();
      render();
    }

    async function publishToGithub() {
      save();
      const payload = {
        headers: HEADERS,
        rows: rows,
        publishedAt: new Date().toISOString()
      };

      const json = JSON.stringify(payload, null, 2);
      const repoUrl = 'https://github.com/Roment01/Reestr_region_SVE';
      const path = 'published-registry.json';

      const rawUrl = `https://raw.githubusercontent.com/Roment01/Reestr_region_SVE/main/${path}?ts=${Date.now()}`;
      let hasFile = false;

      try {
        const res = await fetch(rawUrl, { cache: 'no-store' });
        hasFile = res.ok;
      } catch (error) {
        hasFile = false;
      }

      const encoded = encodeURIComponent(json);
      const targetUrl = hasFile
        ? `${repoUrl}/edit/main/${path}?value=${encoded}`
        : `${repoUrl}/new/main?filename=${encodeURIComponent(path)}&value=${encoded}`;

      status('Открываю GitHub для сохранения публикации...');
      window.open(targetUrl, '_blank');
    }

    function downloadJson() {
      const payload = {
        headers: HEADERS,
        rows: rows,
        publishedAt: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'published-registry.json';
      link.click();
      URL.revokeObjectURL(link.href);
    }

    function loadJson(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (data.rows && Array.isArray(data.rows)) {
            rows = data.rows.map(row => Array.from({ length: 10 }, (_, idx) => clean(row[idx])));
          } else if (Array.isArray(data)) {
            rows = data.map(row => Array.from({ length: 10 }, (_, idx) => clean(row[idx])));
          } else {
            throw new Error('Некорректный JSON');
          }
          save();
          render();
        } catch (error) {
          alert('Ошибка чтения JSON: ' + error.message);
          console.error(error);
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function escapeHtml(value) {
      return clean(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function status(text) {
      document.getElementById('status').textContent = text;
    }

    if (!rows.length) {
      rows = [Array(10).fill('')];
    }

    render();
    status('Редактор готов');
  </script>
</body>
</html>
