<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Реестр АТД — публичная версия</title>
  <style>
    :root{--navy:#1f4e78;--dark:#153754;--border:#cbd5e1;--bg:#f1f5f9;--muted:#64748b}
    *{box-sizing:border-box}body{margin:0;padding:20px;background:linear-gradient(180deg,#f8fafc,var(--bg));color:#1e293b;font-family:Arial,sans-serif}
    .card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 4px 12px rgba(15,23,42,.08);border-left:6px solid var(--navy)}
    h1{margin:0 0 8px;color:var(--navy);font-size:clamp(1.8rem, 3vw, 2.6rem)}
    p{margin:0;color:var(--muted)}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.search{flex:1 1 220px;min-width:180px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font:inherit}
    .table-wrap{overflow:auto;max-height:72vh;background:#fff;border:1px solid var(--border);border-radius:12px}
    table{width:100%;border-collapse:collapse;min-width:1200px}th,td{border:1px solid var(--border);padding:8px 10px;vertical-align:top;text-align:left}
    th{background:#f8fafc;color:#0f172a;position:sticky;top:0;z-index:1}
    .footer{margin-top:14px;padding:10px 14px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;color:#1d4ed8}
  </style>
</head>
<body>
  <header class="card">
    <h1>Реестр АТД Республики Светлославия</h1>
    <p>Публичная версия реестра. Для редактирования используется закрытая страница редактора.</p>
  </header>

  <div class="toolbar">
    <input id="search" class="search" placeholder="Поиск…" oninput="renderFilter()">
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr id="head"></tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
  </div>

  <div class="footer" id="status">Загрузка данных…</div>

  <script>
    const SOURCE = './published-registry.json';
    const body = document.getElementById('body');

    async function loadPublicRegistry() {
      try {
        const res = await fetch(SOURCE, { cache: 'no-store' });
        if (!res.ok) throw new Error('Файл не найден');

        const data = await res.json();
        const headers = Array.isArray(data.headers) ? data.headers : [];
        const rows = Array.isArray(data.rows) ? data.rows : [];

        render(headers, rows);
        document.getElementById('status').textContent = `Опубликовано записей: ${rows.length}`;
      } catch (error) {
        document.getElementById('status').textContent = 'Данные пока не опубликованы.';
        console.error(error);
      }
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function render(headers, rows) {
      const head = document.getElementById('head');
      head.innerHTML = headers.map(h => `<th>${h}</th>`).join('');

      body.innerHTML = rows.map(row => {
        const cells = headers.slice(1).map((_, idx) => `<td>${escapeHtml(row[idx] || '')}</td>`).join('');
        return `<tr><td class="num">${row[0] ?? ''}</td>${cells}</tr>`;
      }).join('');

      renderFilter();
    }

    function renderFilter() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const rows = [...body.rows];
      rows.forEach(tr => {
        tr.style.display = (!q || tr.innerText.toLowerCase().includes(q)) ? '' : 'none';
      });
    }

    loadPublicRegistry();
  </script>
</body>
</html>
