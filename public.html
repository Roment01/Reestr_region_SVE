<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Реестр АТД — публичная версия</title>
  <style>
    :root{
      --bg:#f1f3f5;
      --panel:#f4f6f8;
      --white:#ffffff;
      --navy:#1d4f76;
      --navy-deep:#173d5c;
      --line:#dfe5eb;
      --text:#1d2a39;
      --muted:#5f6f82;
      --accent:#2a6b98;
      --light-blue:#eaf2f8;
      --shadow:0 10px 26px rgba(18,38,63,.08);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .page {
      max-width: 760px;
      margin: 0 auto;
      padding: 18px 12px 24px;
    }

    .header-card {
      background: rgba(255,255,255,.2);
      border-left: 8px solid var(--navy);
      border-radius: 18px;
      padding: 18px 18px 16px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .header-card h1 {
      margin: 0 0 10px;
      font-size: clamp(2.2rem, 5vw, 4rem);
      line-height: 1.05;
      letter-spacing: -0.05em;
      color: var(--navy-deep);
      font-weight: 800;
    }

    .header-card p {
      margin: 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.1vw, 1.4rem);
      line-height: 1.45;
    }

    .toolbar {
      display: grid;
      gap: 12px;
      margin-bottom: 14px;
    }

    .search {
      width: 100%;
      min-height: 58px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.35);
      border-radius: 12px;
      font-size: 1.15rem;
      padding: 12px 16px;
      color: var(--text);
    }

    .table-wrap {
      overflow: auto;
      background: rgba(255,255,255,.18);
      border-radius: 14px;
      border: 1px solid var(--line);
    }

    table {
      width: 100%;
      min-width: 640px;
      border-collapse: collapse;
      font-size: 1rem;
    }

    th, td {
      border: 1px solid var(--line);
      padding: 12px 10px;
      vertical-align: top;
      background: rgba(255,255,255,.18);
    }

    thead th {
      background: var(--navy);
      color: white;
      font-weight: 700;
      font-size: 1.08rem;
      text-align: left;
      padding: 14px 12px;
    }

    tbody td {
      background: #f9fafb;
      color: var(--text);
      font-size: 1.05rem;
    }

    .num {
      width: 70px;
      text-align: center;
      font-weight: 700;
      color: var(--navy);
    }

    .status {
      margin-top: 14px;
      padding: 12px 14px;
      background: #edf5ff;
      border: 1px solid #bfd9f2;
      border-radius: 10px;
      color: #1d4e76;
      font-weight: 600;
      font-size: 1rem;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      gap: 12px;
      padding: 0 8px;
    }

    .site-name {
      font-weight: 700;
      color: var(--navy-deep);
      font-size: clamp(1.3rem, 2.8vw, 2.2rem);
      letter-spacing: -0.04em;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 8px 14px;
      background: #eef3f7;
      color: var(--navy-deep);
      border: 1px solid var(--line);
      font-weight: 700;
      font-size: 0.95rem;
    }

    @media (max-width: 640px) {
      .header-card { padding: 18px 16px; }
      .meta-row {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header-card">
      <h1>Редактор реестра АТД<br>Республики Светлославия</h1>
      <p>Публичная версия реестра. Данные загружаются из файла JSON и отображаются только для просмотра.</p>
    </header>

    <div class="toolbar">
      <input id="search" class="search" placeholder="Поиск..." />
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr id="head"></tr>
        </thead>
        <tbody id="body"></tbody>
      </table>
    </div>

    <div class="meta-row">
      <div class="site-name">roment01.github.io</div>
      <div class="badge" id="countBadge">0 записей</div>
    </div>

    <div class="status" id="status">Загрузка данных…</div>
  </div>

  <script>
    const SOURCE = './published-registry.json';

    async function loadRegistry() {
      try {
        const res = await fetch(SOURCE, { cache: 'no-store' });
        if (!res.ok) throw new Error('Файл не найден');

        const data = await res.json();
        const headers = Array.isArray(data.headers) ? data.headers : [];
        const rows = Array.isArray(data.rows) ? data.rows : [];

        render(headers, rows);
        document.getElementById('status').textContent = 'Данные загружены';
        document.getElementById('countBadge').textContent = `${rows.length} записей`;
      } catch (error) {
        document.getElementById('status').textContent = 'Публикация ещё не создана.';
        console.error(error);
      }
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>\"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function render(headers, rows) {
      const head = document.getElementById('head');
      head.innerHTML = headers.map(h => `<th>${h}</th>`).join('');

      const body = document.getElementById('body');
      body.innerHTML = rows.map((row, index) => {
        const cells = headers.slice(1).map((_, colIdx) => `<td>${escapeHtml(row[colIdx] || '')}</td>`).join('');
        return `<tr>
          <td class="num">${index + 1}</td>
          ${cells}
        </tr>`;
      }).join('');

      renderFilter();
    }

    function renderFilter() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const rows = [...document.querySelectorAll('#body tr')];

      rows.forEach(tr => {
        tr.style.display = (!q || tr.innerText.toLowerCase().includes(q)) ? '' : 'none';
      });
    }

    document.getElementById('search').addEventListener('input', renderFilter);
    loadRegistry();
  </script>
</body>
</html>
